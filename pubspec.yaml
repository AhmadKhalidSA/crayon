name: crayon
description: Generate images and video with any model on OpenRouter.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.7.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.2
  provider: ^6.1.2
  sqflite: ^2.3.3
  path_provider: ^2.1.4
  path: ^1.9.0
  flutter_staggered_grid_view: ^0.7.0
  image_picker: ^1.1.2
  share_plus: ^10.1.2
  gal: ^2.3.0
  url_launcher: ^6.3.1
  flutter_secure_storage: ^9.2.2
  video_player: ^2.9.2
  intl: ^0.19.0
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.4
  # used by test/paths_test.dart to fake the iOS container moving
  path_provider_platform_interface: ^2.1.2
  plugin_platform_interface: ^2.1.8

flutter:
  uses-material-design: true
  assets:
    - assets/catalog.json

flutter_launcher_icons:
  image_path: "assets/icon/crayon.png"
  android: true
  ios: true
  remove_alpha_ios: true
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icon/crayon_fg.png"
  min_sdk_android: 21
